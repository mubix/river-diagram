services:
  river:
    build: .
    image: river-diagram:local
    container_name: river-diagram
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "${RIVER_BIND_ADDRESS:-0.0.0.0}:${RIVER_PORT:-8094}:8080"
    volumes:
      - river-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  river-data:
    name: river-diagram-data
